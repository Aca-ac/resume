name: CI

on:
  push:
    branches: [master, gitlab-deploy]
  pull_request:
    branches: [master]

# Cancel in-progress runs on the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ──────────────────────────────────────────────
  backend:
    name: Backend (Java ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        java-version: [17]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: resume_assistant
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MYSQL_DATABASE: resume_assistant
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      REDIS_PASSWORD: ""
      EMAIL_USERNAME: ci@example.com
      EMAIL_PASSWORD: ci-placeholder
      JWT_SECRET: ci-only-secret-must-be-at-least-32-chars!!

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: maven

      # PDF export embeds CJK glyphs; without these fonts ResumeExportServiceTest fails
      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-wqy-zenhei fonts-noto-color-emoji

      - name: Build & test with Maven
        working-directory: server
        run: >
          mvn verify -B
          -Dspring.datasource.url="jdbc:mysql://localhost:3306/resume_assistant?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC"
          -Dspring.datasource.username=root
          -Dspring.datasource.password=root
          -Dspring.data.redis.host=localhost
          -Dspring.data.redis.port=6379
          -Dspring.data.redis.password=
          -DOPENAI_API_KEY=ci-placeholder
          --no-transfer-progress

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results-java${{ matrix.java-version }}
          path: server/target/surefire-reports/

  # ── Frontend ─────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type-check
        working-directory: web
        run: npm run typecheck

      - name: Build
        working-directory: web
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist/

  # ── Docker smoke test (ensure Dockerfiles are valid) ────
  docker-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend, frontend]
    if: always() && !failure() && !cancelled()

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: server
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
