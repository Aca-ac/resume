version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: resume-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: resume_assistant
      MYSQL_USER: resume
      MYSQL_PASSWORD: resume123
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: resume-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_DATABASE: resume_assistant
      MYSQL_USER: resume
      MYSQL_PASSWORD: resume123
      # MySQL 容器名是 mysql，所以连接地址用 mysql:3306
      # Redis 容器名是 redis
      REDIS_PASSWORD: ""
      JWT_SECRET: "my-secure-jwt-secret-key-at-least-32-chars!!"
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      # APP_CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql-data:
