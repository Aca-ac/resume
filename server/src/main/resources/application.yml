spring:
  application:
    name: resume-assistant
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    url: jdbc:mysql://localhost:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    ignore-failed-migrations: true   # 专门针对 failed 状态，忽略它
    validate-on-migrate: false   # 启动时跳过校验，直接运行

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  expose-error-details: false
  storage:
    upload-dir: uploads/resumes
    max-file-size: 104857600
    chunk-dir: uploads/resumes/chunks
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-minutes: 60
    refresh-expiration-days: 7
  rate-limit:
    login-max-per-minute: 10
    ai-max-per-minute: 20
  ai:
    provider: openai
    openai:
      base-url: https://api.openai.com/v1
      api-key: ${OPENAI_API_KEY:}
      model: gpt-4o-mini
    qwen:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DASHSCOPE_API_KEY:${QWEN_API_KEY:}}
      model: qwen-plus
      ocr-model: ${QWEN_OCR_MODEL:qwen-vl-ocr}
      workspace-id: ${QWEN_WORKSPACE_ID:}
  match:
    # general | technical | management
    dimension-preset: general
  export:
    libreoffice-command: ${LIBREOFFICE_COMMAND:soffice}
    convert-timeout-seconds: 120

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

email:
  smtp:
    host: smtp.qq.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    protocol: smtp
    timeout: 5000
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


