spring:
  application:
    name: resume-assistant
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    url: jdbc:mysql://localhost:3306/resume_assistant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: resume
    password: resume123
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  expose-error-details: false
  storage:
    upload-dir: uploads/resumes
    max-file-size: 104857600
    chunk-dir: uploads/resumes/chunks
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-must-be-at-least-32-chars!!}
    access-expiration-minutes: 60
    refresh-expiration-days: 7
  rate-limit:
    login-max-per-minute: 10
    ai-max-per-minute: 20
  ai:
    provider: openai
    openai:
      base-url: https://api.openai.com/v1
      api-key: ${OPENAI_API_KEY:}
      model: gpt-4o-mini
    qwen:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DASHSCOPE_API_KEY:${QWEN_API_KEY:}}
      model: qwen-plus
      ocr-model: ${QWEN_OCR_MODEL:qwen-vl-ocr}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

email:
  smtp:
    host: smtp.qq.com
    port: 587
    username: 1317978599@qq.com
    password: lysbbtvvlnwmjdjd
    protocol: smtp
    timeout: 5000
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

dashscope:
  api-key: ${DASHSCOPE_API_KEY:${QWEN_API_KEY:}}

