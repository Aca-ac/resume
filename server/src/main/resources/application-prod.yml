spring:
  datasource:
    url: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: redis
      port: 6379
      database: 0
      password: ${REDIS_PASSWORD:}

app:
  expose-error-details: false
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost}

logging:
  level:
    com.resume: info
