# GitLab CI/CD - Resume Assistant
# Runner: WSL-Docker-Runner #58, tag #win-docker, docker executor + host socket

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - test
  - docker

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=/cache/maven/repository -Dmaven.artifact.threads=8"
  DOCKER_HOST: unix:///var/run/docker.sock
  NPM_CONFIG_REGISTRY: "https://registry.npmmirror.com"
  GIT_DEPTH: "1"

.test-base:
  stage: test
  tags: ["#win-docker"]
  interruptible: true
  timeout: 4m
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

backend-test:
  extends: .test-base
  image:
    name: docker.m.daocloud.io/library/maven:3.9-eclipse-temurin-17
    pull_policy: if-not-present
  before_script:
    - mkdir -p /cache/maven/repository
  script:
    - cd server
    - mvn -s .mvn/settings.xml test --no-transfer-progress -B -nsu
  artifacts:
    when: always
    reports:
      junit: server/target/surefire-reports/TEST-*.xml
    paths:
      - server/target/surefire-reports/
    expire_in: 7 days

frontend-test:
  extends: .test-base
  image:
    name: docker.m.daocloud.io/library/node:20-alpine
    pull_policy: if-not-present
  before_script:
    - cd web
    - npm config set registry https://registry.npmmirror.com
    - npm ci --no-audit --prefer-offline --fetch-retries=3 --fetch-retry-mintimeout=10000 --fetch-retry-maxtimeout=60000
  script:
    - npm run typecheck
    - npm run build
  artifacts:
    paths:
      - web/dist/
    expire_in: 1 day

.docker-base:
  stage: docker
  tags: ["#win-docker"]
  image:
    name: docker.m.daocloud.io/library/docker:24-cli
    pull_policy: if-not-present
  interruptible: true
  timeout: 15m
  before_script:
    - docker info

backend-docker:
  extends: .docker-base
  needs:
    - job: backend-test
      artifacts: false
  script:
    - export IMAGE="${CI_REGISTRY_IMAGE:-local}/backend"
    - docker build -t "$IMAGE:$CI_COMMIT_SHORT_SHA" -t "$IMAGE:$CI_COMMIT_REF_SLUG" -f server/Dockerfile server/
    - |
      if [ -n "$CI_REGISTRY" ] && [ -n "$CI_REGISTRY_IMAGE" ] && [ -n "$CI_REGISTRY_USER" ] && [ -n "$CI_REGISTRY_PASSWORD" ] && { [ "$CI_COMMIT_BRANCH" = "gitlab-deploy" ] || [ -n "$CI_COMMIT_TAG" ]; }; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:latest"
        docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
        docker push "$IMAGE:$CI_COMMIT_REF_SLUG"
        docker push "$IMAGE:latest"
        echo "Pushed $IMAGE:$CI_COMMIT_REF_SLUG"
      else
        echo "Build OK; skip registry push (registry credentials not configured)"
      fi
  after_script:
    - docker logout "$CI_REGISTRY" 2>/dev/null || true

frontend-docker:
  extends: .docker-base
  needs:
    - job: frontend-test
      artifacts: false
  script:
    - export IMAGE="${CI_REGISTRY_IMAGE:-local}/frontend"
    - docker build -t "$IMAGE:$CI_COMMIT_SHORT_SHA" -t "$IMAGE:$CI_COMMIT_REF_SLUG" -f web/Dockerfile web/
    - |
      if [ -n "$CI_REGISTRY" ] && [ -n "$CI_REGISTRY_IMAGE" ] && [ -n "$CI_REGISTRY_USER" ] && [ -n "$CI_REGISTRY_PASSWORD" ] && { [ "$CI_COMMIT_BRANCH" = "gitlab-deploy" ] || [ -n "$CI_COMMIT_TAG" ]; }; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:latest"
        docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
        docker push "$IMAGE:$CI_COMMIT_REF_SLUG"
        docker push "$IMAGE:latest"
        echo "Pushed $IMAGE:$CI_COMMIT_REF_SLUG"
      else
        echo "Build OK; skip registry push (registry credentials not configured)"
      fi
  after_script:
    - docker logout "$CI_REGISTRY" 2>/dev/null || true