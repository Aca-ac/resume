# GitLab CI/CD - Resume Assistant
# Runner tag: win-docker (WSL-Docker-Runner)

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - test
  - docker

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=${CI_PROJECT_DIR}/server/.m2/repository"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - server/.m2/repository/
    - web/node_modules/

backend-test:
  stage: test
  tags: [win-docker]
  image: maven:3.9-eclipse-temurin-17
  interruptible: true
  script:
    - cd server
    - mvn test --no-transfer-progress -B
  artifacts:
    when: always
    reports:
      junit: server/target/surefire-reports/TEST-*.xml
    paths:
      - server/target/surefire-reports/
    expire_in: 7 days

frontend-test:
  stage: test
  tags: [win-docker]
  image: node:20-alpine
  interruptible: true
  before_script:
    - cd web && npm ci --prefer-offline
  script:
    - cd web
    - npm run typecheck
    - npm run build
  artifacts:
    paths:
      - web/dist/
    expire_in: 1 day

.docker-base:
  stage: docker
  tags: [win-docker]
  image: docker:24-cli
  services:
    - docker:24-dind
  interruptible: true
  before_script:
    - docker info
    - |
      if [ "$CI_COMMIT_BRANCH" = "gitlab-deploy" ] || [ -n "$CI_COMMIT_TAG" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      fi

backend-docker:
  extends: .docker-base
  needs: ["backend-test"]
  script:
    - export IMAGE="$CI_REGISTRY_IMAGE/backend"
    - docker build -t "$IMAGE:$CI_COMMIT_SHORT_SHA" -t "$IMAGE:$CI_COMMIT_REF_SLUG" -f server/Dockerfile server/
    - |
      if [ "$CI_COMMIT_BRANCH" = "gitlab-deploy" ] || [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:latest"
        docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
        docker push "$IMAGE:$CI_COMMIT_REF_SLUG"
        docker push "$IMAGE:latest"
        echo "Pushed $IMAGE:$CI_COMMIT_REF_SLUG"
      else
        echo "Build-only mode (no push on branch $CI_COMMIT_BRANCH)"
      fi
  after_script:
    - docker logout "$CI_REGISTRY" 2>/dev/null || true

frontend-docker:
  extends: .docker-base
  needs: ["frontend-test"]
  script:
    - export IMAGE="$CI_REGISTRY_IMAGE/frontend"
    - docker build -t "$IMAGE:$CI_COMMIT_SHORT_SHA" -t "$IMAGE:$CI_COMMIT_REF_SLUG" -f web/Dockerfile web/
    - |
      if [ "$CI_COMMIT_BRANCH" = "gitlab-deploy" ] || [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:latest"
        docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
        docker push "$IMAGE:$CI_COMMIT_REF_SLUG"
        docker push "$IMAGE:latest"
        echo "Pushed $IMAGE:$CI_COMMIT_REF_SLUG"
      else
        echo "Build-only mode (no push on branch $CI_COMMIT_BRANCH)"
      fi
  after_script:
    - docker logout "$CI_REGISTRY" 2>/dev/null || true