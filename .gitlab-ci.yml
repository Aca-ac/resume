# GitLab CI/CD - Resume Assistant
# Runner tag: #win-docker (WSL-Docker-Runner #58, docker executor + host socket)
# No GitLab cache block: runner has no S3/GCS cache adapter configured.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - test
  - docker

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=${CI_PROJECT_DIR}/server/.m2/repository"
  DOCKER_HOST: unix:///var/run/docker.sock
  NPM_CONFIG_REGISTRY: "https://registry.npmmirror.com"

.test-base:
  stage: test
  tags: ["#win-docker"]
  interruptible: true

backend-test:
  extends: .test-base
  image: maven:3.9-eclipse-temurin-17
  before_script:
    - mkdir -p server/.m2
    - |
      cat > server/.m2/settings.xml <<'EOF'
      <settings>
        <mirrors>
          <mirror>
            <id>aliyun</id>
            <mirrorOf>central</mirrorOf>
            <url>https://maven.aliyun.com/repository/public</url>
          </mirror>
        </mirrors>
      </settings>
      EOF
  script:
    - cd server
    - mvn test --no-transfer-progress -B
  artifacts:
    when: always
    reports:
      junit: server/target/surefire-reports/TEST-*.xml
    paths:
      - server/target/surefire-reports/
    expire_in: 7 days

frontend-test:
  extends: .test-base
  image: node:20-alpine
  before_script:
    - cd web
    - npm ci --no-audit
  script:
    - npm run typecheck
    - npm run build
  artifacts:
    paths:
      - web/dist/
    expire_in: 1 day

.docker-base:
  stage: docker
  tags: ["#win-docker"]
  image: docker:24-cli
  interruptible: true
  before_script:
    - docker info
    - |
      if [ "$CI_COMMIT_BRANCH" = "gitlab-deploy" ] || [ -n "$CI_COMMIT_TAG" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      fi

backend-docker:
  extends: .docker-base
  needs:
    - job: backend-test
      artifacts: false
  script:
    - export IMAGE="$CI_REGISTRY_IMAGE/backend"
    - docker build -t "$IMAGE:$CI_COMMIT_SHORT_SHA" -t "$IMAGE:$CI_COMMIT_REF_SLUG" -f server/Dockerfile server/
    - |
      if [ "$CI_COMMIT_BRANCH" = "gitlab-deploy" ] || [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:latest"
        docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
        docker push "$IMAGE:$CI_COMMIT_REF_SLUG"
        docker push "$IMAGE:latest"
        echo "Pushed $IMAGE:$CI_COMMIT_REF_SLUG"
      else
        echo "Build-only mode (no push on branch $CI_COMMIT_BRANCH)"
      fi
  after_script:
    - docker logout "$CI_REGISTRY" 2>/dev/null || true

frontend-docker:
  extends: .docker-base
  needs:
    - job: frontend-test
      artifacts: false
  script:
    - export IMAGE="$CI_REGISTRY_IMAGE/frontend"
    - docker build -t "$IMAGE:$CI_COMMIT_SHORT_SHA" -t "$IMAGE:$CI_COMMIT_REF_SLUG" -f web/Dockerfile web/
    - |
      if [ "$CI_COMMIT_BRANCH" = "gitlab-deploy" ] || [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:latest"
        docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
        docker push "$IMAGE:$CI_COMMIT_REF_SLUG"
        docker push "$IMAGE:latest"
        echo "Pushed $IMAGE:$CI_COMMIT_REF_SLUG"
      else
        echo "Build-only mode (no push on branch $CI_COMMIT_BRANCH)"
      fi
  after_script:
    - docker logout "$CI_REGISTRY" 2>/dev/null || true