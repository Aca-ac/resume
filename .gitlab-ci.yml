# ─────────────────────────────────────────────────────
# GitLab CI — 智通车 (Resume Assistant)
# ─────────────────────────────────────────────────────

stages:
  - test
  - docker-check

# ── Global cache ────────────────────────────────────
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - server/.m2/repository/
    - web/node_modules/

# ═══════════════════════════════════════════════════════
#  Stage 1 — Test
# ═══════════════════════════════════════════════════════

# ── Backend (Java 17 + Maven) ────────────────────────
backend-test:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=${CI_PROJECT_DIR}/server/.m2/repository"
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: resume_assistant
    REDIS_HOST: redis
  services:
    - name: mysql:8.0
      alias: mysql
      variables:
        MYSQL_ROOT_PASSWORD: root
        MYSQL_DATABASE: resume_assistant
    - name: redis:7-alpine
      alias: redis
  script:
    - cd server
    - >
      mvn verify -B
      -Dspring.datasource.url="jdbc:mysql://mysql:3306/resume_assistant?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC"
      -Dspring.datasource.username=root
      -Dspring.datasource.password=root
      -Dspring.data.redis.host=redis
      -Dspring.data.redis.port=6379
      -Dspring.data.redis.password=
      -DOPENAI_API_KEY=ci-placeholder
      --no-transfer-progress
  artifacts:
    when: always
    paths:
      - server/target/surefire-reports/
    expire_in: 7 days
  coverage: '/Lines\s*:\s*(\d+(?:\.\d+)?)%/'

# ── Frontend (Node 20 + Vite) ────────────────────────
frontend-test:
  stage: test
  image: node:20-alpine
  before_script:
    - cd web && npm ci --prefer-offline
  script:
    - cd web
    - npm run typecheck
    - npm run build
  artifacts:
    paths:
      - web/dist/
    expire_in: 1 day

# ═══════════════════════════════════════════════════════
#  Stage 2 — Docker Build Check (no push)
# ═══════════════════════════════════════════════════════

backend-docker-check:
  stage: docker-check
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -f server/Dockerfile server/

frontend-docker-check:
  stage: docker-check
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build -f web/Dockerfile web/
