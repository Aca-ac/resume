# ─────────────────────────────────────────────────────
# GitLab CI/CD Pipeline — 智通车 (Resume Assistant)
# ─────────────────────────────────────────────────────

stages:
  - test
  - docker

# ── Global cache ────────────────────────────────────
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - server/.m2/repository/
    - web/node_modules/

# ═══════════════════════════════════════════════════════
#  Stage 1 — Test
# ═══════════════════════════════════════════════════════

# ── Backend (Java 17 + Maven) ────────────────────────
backend-test:
  stage: test
  tags: [win-docker]
  image: maven:3.9-eclipse-temurin-17
  services:
    - name: mysql:8.0
      alias: mysql
    - name: redis:7-alpine
      alias: redis
  variables:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: resume_assistant
    MAVEN_OPTS: "-Dmaven.repo.local=${CI_PROJECT_DIR}/server/.m2/repository"
  before_script:
    - apt-get update -qq && apt-get install -y -qq mysql-client > /dev/null
    - echo "Waiting for MySQL to be ready..."
    - until mysqladmin ping -h mysql --silent; do sleep 2; done
    - echo "MySQL is ready."
  script:
    - cd server
    - mvn verify
      -Dspring.datasource.url="jdbc:mysql://mysql:3306/resume_assistant?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC"
      -Dspring.datasource.username=root
      -Dspring.datasource.password=root
      -Dspring.data.redis.host=redis
      -Dspring.data.redis.port=6379
      -Dspring.data.redis.password=
      -DOPENAI_API_KEY=ci-placeholder
      --no-transfer-progress
  artifacts:
    when: always
    paths:
      - server/target/surefire-reports/
    expire_in: 7 days
  coverage: '/Lines\s*:\s*(\d+(?:\.\d+)?)%/'

# ── Frontend (Node 20 + Vite) ────────────────────────
frontend-test:
  stage: test
  tags: [win-docker]
  image: node:20-alpine
  before_script:
    - cd web && npm ci --prefer-offline
  script:
    - cd web
    - npm run typecheck
    - npm run build
  artifacts:
    paths:
      - web/dist/
    expire_in: 1 day

# ═══════════════════════════════════════════════════════
#  Stage 2 — Build & Push Docker Images
# ═══════════════════════════════════════════════════════

.docker-build:
  stage: docker
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  dependencies: []
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  after_script:
    - docker logout "$CI_REGISTRY" || true

# ── Backend image ────────────────────────────────────
backend-docker:
  extends: .docker-build
  tags: [win-docker]
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/backend"
      docker build \
        --tag "$IMAGE:$CI_COMMIT_REF_SLUG" \
        --tag "$IMAGE:latest" \
        -f server/Dockerfile server/
      docker push "$IMAGE:$CI_COMMIT_REF_SLUG"
      docker push "$IMAGE:latest"
      echo "✅ Backend image pushed: $IMAGE:$CI_COMMIT_REF_SLUG"
  rules:
    - if: $CI_COMMIT_BRANCH == "gitlab-deploy"
    - if: $CI_COMMIT_TAG

# ── Frontend image ───────────────────────────────────
frontend-docker:
  extends: .docker-build
  tags: [win-docker]
  script:
    - |
      IMAGE="$CI_REGISTRY_IMAGE/frontend"
      docker build \
        --tag "$IMAGE:$CI_COMMIT_REF_SLUG" \
        --tag "$IMAGE:latest" \
        -f web/Dockerfile web/
      docker push "$IMAGE:$CI_COMMIT_REF_SLUG"
      docker push "$IMAGE:latest"
      echo "✅ Frontend image pushed: $IMAGE:$CI_COMMIT_REF_SLUG"
  rules:
    - if: $CI_COMMIT_BRANCH == "gitlab-deploy"
    - if: $CI_COMMIT_TAG
